name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared matrix/fmt/clippy/docs/miri from puremourning/rust-ci. System
  # dependencies go in .github/actions/setup/action.yml (see CLAUDE.md).
  # Add project-specific jobs alongside this one.
  ci:
    uses: puremourning/rust-ci/.github/workflows/ci.yml@v1
    with:
      msrv: "1.98"
      # x86_64 (with the inline-asm mul19_hw path) and aarch64.
      runners: '["ubuntu-latest", "macos-latest"]'
      miri: true
