[workspace]
resolver = "3"
members = [
  "crates/decimix",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Ben Jackson <puremourning@gmail.com>"]
repository = "https://github.com/puremourning/decimix"

[workspace.dependencies]
decimix = { path = "crates/decimix", version = "0.1.0" }

# Test and bench only.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
num-bigint = "0.4"
num-integer = "0.1"
proptest = "1"

[workspace.metadata.release]
# One shared version and a single `vX.Y.Z` tag for the whole workspace. Crates
# with `publish = false` are skipped; add `tag = false` to secondary crates if
# more are published. Driven by the Release workflow (puremourning/rust-ci).
shared-version = true
tag-name = "v{{version}}"
allow-branch = ["main"]
pre-release-commit-message = "Release v{{version}}"
