# Fuzz targets for decimix, run with cargo-fuzz (nightly):
#   cargo install cargo-fuzz
#   cd fuzz && cargo fuzz run parse -- -max_total_time=60
# Not part of the main workspace.
[package]
name = "decimix-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
decimix = { path = "../crates/decimix" }
libfuzzer-sys = "0.4"
num-bigint = "0.4"
num-integer = "0.1"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arith"
path = "fuzz_targets/arith.rs"
test = false
doc = false
bench = false

[[bin]]
name = "f64"
path = "fuzz_targets/f64.rs"
test = false
doc = false
bench = false

[workspace]
